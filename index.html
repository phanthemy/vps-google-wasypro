<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/favicon-150x150.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5" />
    <title>WASY PRO | Water King - Máy Lọc Nước Hydrogen Giàu Ion Kiềm Sạch</title>
    <meta name="description" content="Water King chuyên cung cấp máy lọc nước Hydrogen giàu ion kiềm sạch, nước Hydrogen đóng chai và linh kiện máy lọc nước chính hãng. Giải pháp nước sạch hiện đại." />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Auto Clear Old PWA Service Worker Cache -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (let registration of registrations) {
            registration.unregister();
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (let name of names) caches.delete(name);
        });
      }
      // Khách vãng lai: Tự động dọn sạch wasy_ref_code nếu URL không có param ref
      try {
        var p = new URLSearchParams(window.location.search);
        if (!p.get('ref') && !p.get('refCode') && !p.get('referral')) {
          localStorage.removeItem('wasy_ref_code');
          sessionStorage.removeItem('wasy_ref_code');
          document.cookie = 'wasy_ref=; max-age=0; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT; SameSite=Lax;';
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased selection:bg-ocean-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
