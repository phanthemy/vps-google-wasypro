server {
    listen 80;
    server_name wasypro.com www.wasypro.com;

    # Redirect HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name wasypro.com www.wasypro.com;

    # SSL certificates (Configure with Certbot / Let's Encrypt)
    # ssl_certificate /etc/letsencrypt/live/wasypro.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/wasypro.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:5005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
